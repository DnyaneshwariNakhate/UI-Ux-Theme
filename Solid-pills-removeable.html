<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
   <style>
   body {
  font-family: Poppins, sans-serif;
  background: #f9f9f9;
  padding: 20px;
}

.pill-wrapper {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.pill {
  display: inline-flex;
  align-items: center;
  background: #e6f7f7;
  color: #00999A;
  padding: 6px 12px;
  border-radius: 25px;
  font-size: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  transition: background 0.2s;
}

.pill:hover {
  background: #d4f0f0;
}

.remove-btn {
  margin-left: 8px;
  font-size: 16px;
  cursor: pointer;
}

.mobile-toggle {
  display: none;
  background: #00999A;
  color: white;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 15px;
  cursor: pointer;
}

.mobile-pill-menu {
  display: none;
  flex-wrap: wrap;
  gap: 10px;
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

@media (max-width: 600px) {
  .pill-wrapper {
    display: none; /* hide desktop pills on mobile */
  }
  .mobile-toggle {
    display: inline-block;
  }
}
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                       <!-- Pills Container -->
<div class="pill-wrapper">
  <div class="pill">UI Design <span class="remove-btn">&times;</span></div>
  <div class="pill">HTML <span class="remove-btn">&times;</span></div>
  <div class="pill">CSS <span class="remove-btn">&times;</span></div>
  <div class="pill">JavaScript <span class="remove-btn">&times;</span></div>
  <div class="pill">React <span class="remove-btn">&times;</span></div>
</div>

<!-- Mobile Menu Button -->
<button class="mobile-toggle" id="mobileToggle">☰ Tags</button>

<!-- Mobile Menu Pills -->
<div class="mobile-pill-menu" id="mobilePillMenu">
  <div class="pill">UI Design <span class="remove-btn">&times;</span></div>
  <div class="pill">HTML <span class="remove-btn">&times;</span></div>
  <div class="pill">CSS <span class="remove-btn">&times;</span></div>
  <div class="pill">JavaScript <span class="remove-btn">&times;</span></div>
  <div class="pill">React <span class="remove-btn">&times;</span></div>
</div>

                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
   <script>
// Remove pill when X is clicked
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("remove-btn")) {
    e.target.parentElement.remove();
  }
});

// Mobile menu toggle
const mobileToggle = document.getElementById("mobileToggle");
const mobilePillMenu = document.getElementById("mobilePillMenu");

mobileToggle.addEventListener("click", () => {
  mobilePillMenu.style.display = 
    mobilePillMenu.style.display === "flex" ? "none" : "flex";
});
</script>
</body>

</html>
