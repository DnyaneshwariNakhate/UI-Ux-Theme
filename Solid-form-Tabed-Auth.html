<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
   <style>
    body {
        font-family: Poppins, sans-serif;
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
        /* height: 100vh; */
        margin: 0;
    }

    .auth-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        max-width: 400px;
        width: 100%;
        padding: 20px;
    }

    /* .tab-header {
        display: flex;
        border-bottom: 2px solid #eee;
    } */

.tab-header {
    display: flex;
    border-bottom: 2px solid #eee;
    position: relative;
}

.tab-indicator {
    position: absolute;
    bottom: 0;
    height: 3px;
    background: #00999A;
    transition: 0.3s ease;
}


    .tab-header button {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 500;
        border-bottom: 3px solid transparent; /* Set base border */
    transition: border-color 0.2s ease, color 0.2s ease; /* Smooth color change */
    }

    .tab-header button.active {
       border-color: #00999A; /* Smoothly changes */
    color: #00999A;
    font-weight: 600;
    }

    .tab-content {
        display: none;
        padding-top: 20px;
    }

    .tab-content.active {
        display: block;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 500;
        display: block;
        margin-bottom: 5px;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-group input:focus {
        border-color: #00999A;
        outline: none;
    }

    .btn-primary {
        width: 100%;
        padding: 12px;
        background: #00999A;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .btn-primary:hover {
        background: #007a7b;
    }

    .form-footer {
        text-align: center;
        margin-top: 10px;
    }

    .form-footer a {
        color: #00999A;
        font-size: 14px;
        text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 480px) {
        .auth-card {
            padding: 15px;
        margin: 20px;
        }
        .tab-header button {
            font-size: 14px;
        }
    }
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <div class="auth-card">
    <!-- <div class="tab-header">
        <button class="active" onclick="openTab(event, 'login')">Login</button>
        <button onclick="openTab(event, 'signup')">Sign Up</button>
    </div> -->
    <div class="tab-header">
    <button class="active" onclick="openTab(event, 'login')">Login</button>
    <button onclick="openTab(event, 'signup')">Sign Up</button>
    <div class="tab-indicator"></div> <!-- Add this line -->
</div>


    <div id="login" class="tab-content active">
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
        </div>
        <button class="btn-primary">Login</button>
        <div class="form-footer">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

    <div id="signup" class="tab-content">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password">
        </div>
        <button class="btn-primary">Sign Up</button>
    </div>
</div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
   function openTab(evt, tabId) {
    const contents = document.querySelectorAll('.tab-content');
    const buttons = document.querySelectorAll('.tab-header button');
    const indicator = document.querySelector('.tab-indicator');

    contents.forEach(c => c.classList.remove('active'));
    buttons.forEach(b => b.classList.remove('active'));

    const activeButton = evt.currentTarget;
    activeButton.classList.add('active');
    document.getElementById(tabId).classList.add('active');

    // Move indicator under the active button
    indicator.style.width = activeButton.offsetWidth + 'px';
    indicator.style.left = activeButton.offsetLeft + 'px';
}

// Initialize indicator position on page load
window.onload = () => {
    const activeButton = document.querySelector('.tab-header button.active');
    const indicator = document.querySelector('.tab-indicator');
    indicator.style.width = activeButton.offsetWidth + 'px';
    indicator.style.left = activeButton.offsetLeft + 'px';
};

</script>
</body>

</html>
