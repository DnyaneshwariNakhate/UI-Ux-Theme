<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
     <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navbar / Top Bar */
    .topbar {
      background: #00999A;
      color: #fff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-btn {
      font-size: 22px;
      cursor: pointer;
      background: none;
      border: none;
      color: #fff;
    }

    /* Drawer Styles */
    .drawer {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #111;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
      z-index: 1000;
    }

    .drawer a {
      padding: 12px 20px;
      text-decoration: none;
      font-size: 18px;
      color: #f1f1f1;
      display: block;
      transition: 0.2s;
    }

    .drawer a:hover {
      background: #00999A;
    }

    .drawer .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 25px;
      cursor: pointer;
      color: #fff;
      background: none;
      border: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .drawer a {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <!-- Topbar -->
                        <div class="topbar">
                            <button class="menu-btn" onclick="openDrawer()">☰</button>
                            <h2>My Website</h2>
                        </div>
                
                        <!-- Drawer -->
                        <div id="drawer" class="drawer">
                            <button class="close-btn" onclick="closeDrawer()">×</button>
                            <a href="#">Home</a>
                            <a href="#">About</a>
                            <a href="#">Services</a>
                            <a href="#">Portfolio</a>
                            <a href="#">Contact</a>
                        </div>
                
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
     <script>
    function openDrawer() {
      document.getElementById("drawer").style.width = "250px";
    }
    function closeDrawer() {
      document.getElementById("drawer").style.width = "0";
    }
  </script>
</body>

</html>
