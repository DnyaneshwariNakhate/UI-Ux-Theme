<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    /* Tabs Container */
    .tabs-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 8px 16px;
      border-bottom: 1px solid #ddd;
      position: relative;
    }

    .tabs {
      display: flex;
      gap: 10px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s, color 0.3s;
    }

    .tab i {
      font-size: 16px;
    }

    .tab.active {
      background: #00999A;
      color: white;
    }

    .tab:hover {
      background: #005353;
      color: white;
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* Tab Content */
    .tab-content {
      padding: 20px;
    }

    .content {
      display: none;
    }

    .content.active {
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tabs {
        display: none;
        flex-direction: column;
        background: white;
        position: absolute;
        top: 50px;
        left: 0;
        right: 0;
        padding: 10px 0;
        border-top: 1px solid #ddd;
      }

      .tabs.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                         <!-- Tabs -->
            <nav class="tabs-container">
              <div class="tabs" id="tabs">
                <button class="tab active" data-tab="home">
                  <i class="ri-home-5-line"></i>
                  <span>Home</span>
                </button>
                <button class="tab" data-tab="documents">
                  <i class="ri-file-line"></i>
                  <span>Documents</span>
                </button>
                <button class="tab" data-tab="settings">
                 <i class="ri-settings-5-line"></i>
                  <span>Settings</span>
                </button>
              </div>

              <!-- Mobile menu toggle -->
              <button class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
              </button>
            </nav>

            <!-- Tab content -->
            <div class="tab-content" id="tabContent">
              <div class="content active" id="home">Welcome to Home</div>
              <div class="content" id="documents">Your Documents</div>
              <div class="content" id="settings">Settings Page</div>
            </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
   <script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Remove active from all
        tabs.forEach(t => t.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));

        // Add active to clicked
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');

        // Close menu on mobile after click
        document.getElementById('tabs').classList.remove('show');
      });
    });

    // Mobile menu toggle
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('tabs').classList.toggle('show');
    });
  </script>
</body>

</html>
