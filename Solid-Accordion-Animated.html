<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
 <style>
.accordion {
  max-width: 600px;
  margin: 20px auto;
  font-family: Poppins, sans-serif;
}

.accordion-header {
  background: #00999A;
  color: white;
  padding: 16px 20px;
  width: 100%;
  text-align: left;
  border: none;
  outline: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.3s ease;
  border-radius: 8px;
  margin-bottom: 6px;
}

.accordion-header:hover {
  background: #007f80;
}

.accordion-header[aria-expanded="true"] {
  background: #007f80;
}

.icon {
  transition: transform 0.3s ease;
  font-weight: bold;
}

.accordion-header[aria-expanded="true"] .icon {
  transform: rotate(45deg);
}

/* Accordion Content */
.accordion-content {
  overflow: hidden;
  padding: 0 20px;
  font-size: 16px;
  color: #333;
  background: #f1f1f1;
  border-radius: 0 0 8px 8px;
  margin-bottom: 12px;
  
  /* For smooth height transition */
  max-height: 0;
  opacity: 0;
  transform: scaleY(0.95);
  transform-origin: top;
  transition: max-height 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
}

/* When expanded */
.accordion-content.show {
  max-height: 500px; /* large enough to show content */
  opacity: 1;
  transform: scaleY(1);
  padding: 16px 20px;
}
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                    <div class="accordion">
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                What is your return policy?
                                <span class="icon">+</span>
                            </button>
                            <div class="accordion-content" hidden>
                                <p>Our return policy lasts 30 days...</p>
                            </div>
                        </div>
                    
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                How do I track my order?
                                <span class="icon">+</span>
                            </button>
                            <div class="accordion-content" hidden>
                                <p>You can track your order by...</p>
                            </div>
                        </div>
                    </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
<script>
    const headers = document.querySelectorAll('.accordion-header');

headers.forEach(header => {
  header.addEventListener('click', () => {
    const expanded = header.getAttribute('aria-expanded') === 'true';
    header.setAttribute('aria-expanded', !expanded);
    
    const content = header.nextElementSibling;
    if (!expanded) {
      content.classList.add('show');
      content.removeAttribute('hidden');
    } else {
      content.classList.remove('show');
      content.setAttribute('hidden', '');
    }
  });
});

</script>
</body>

</html>
