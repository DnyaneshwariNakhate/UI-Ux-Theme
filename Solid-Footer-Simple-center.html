<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root {
    --footer-bg: #f8f9fb;
    --footer-fg: #3a3f45;
    --footer-muted: #8a9097;
    --footer-gap: 10px;
    --footer-pad: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --footer-bg: #0f1115;
      --footer-fg: #e6e8eb;
      --footer-muted: #a0a6ad;
    }
  }
  .footer {
    display: grid;
    gap: 6px;
    place-items: center;
    text-align: center;
    padding: var(--footer-pad);
    background: var(--footer-bg);
    color: var(--footer-fg);
    font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .footer-nav {
    display: inline-flex;
    gap: var(--footer-gap);
    align-items: center;
  }
  .footer a {
    color: inherit;
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }
  .footer-copy { margin: 0; color: var(--footer-muted); }
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
            <footer class="footer" role="contentinfo">
                <nav class="footer-nav" aria-label="Footer">
                    <a href="/privacy">Privacy</a>
                    <span aria-hidden="true">•</span>
                    <a href="/terms">Terms</a>
                </nav>
                <p class="footer-copy">© <span id="year"></span> Your Company</p>
            </footer>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
   <script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
 
</body>

</html>
