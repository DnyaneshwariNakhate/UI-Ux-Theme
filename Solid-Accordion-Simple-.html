<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
 <style>
        .accordion {
  max-width: 600px;
  margin: auto;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}

.accordion-item {
  border-bottom: 1px solid #ddd;
}

.accordion-header {
  width: 100%;
  padding: 15px;
  text-align: left;
  font-size: 1.1rem;
  background: #f9f9f9;
  border: none;
  outline: none;
  cursor: pointer;
  transition: background 0.3s ease;
}

.accordion-header:hover {
  background: #f1f1f1;
}

.accordion-content {
  max-height: 0;
  overflow: hidden;
  padding: 0 15px;
  background: white;
  transition: max-height 0.3s ease, padding 0.3s ease;
}

.accordion-content p {
  margin: 15px 0;
}

/* Active state */
.accordion-item.active .accordion-content {
  max-height: 200px; /* enough space for text */
  padding: 15px;
}

    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                    <div class="accordion">
                        <div class="accordion-item">
                            <button class="accordion-header">What is your return policy?</button>
                            <div class="accordion-content">
                                <p>We accept returns within 30 days with proof of purchase.</p>
                            </div>
                        </div>
                    
                        <div class="accordion-item">
                            <button class="accordion-header">Do you ship internationally?</button>
                            <div class="accordion-content">
                                <p>Yes, we ship to over 50 countries worldwide.</p>
                            </div>
                        </div>
                    
                        <div class="accordion-item">
                            <button class="accordion-header">How can I track my order?</button>
                            <div class="accordion-content">
                                <p>You will receive a tracking link by email once your order ships.</p>
                            </div>
                        </div>
                    </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
<script>const accordionItems = document.querySelectorAll(".accordion-item");

accordionItems.forEach(item => {
  const header = item.querySelector(".accordion-header");

  header.addEventListener("click", () => {
    // Close all other items
    accordionItems.forEach(i => {
      if (i !== item) i.classList.remove("active");
    });

    // Toggle clicked item
    item.classList.toggle("active");
  });
});
</script>
</body>

</html>
