<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
   <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
  background-color: #f4f7fc;
}

.dashboard {
  display: flex;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background-color: #1e293b;
  color: #fff;
  padding: 20px;
  transition: width 0.3s;
}
.sidebar.collapsed {
  width: 60px;
}
.sidebar-logo {
  font-size: 20px;
  margin-bottom: 30px;
}
.sidebar nav a {
  display: block;
  padding: 12px 10px;
  color: #cbd5e1;
  text-decoration: none;
  border-radius: 5px;
  margin-bottom: 8px;
}
.sidebar nav a:hover {
  background-color: #334155;
}

.sidebar nav a {
  display: flex; /* Add this to align icon and label */
  align-items: center;
  gap: 10px;
  padding-left: 0;
}

.sidebar .icon {
  width: 24px;
  text-align: center;
  font-size: 18px;
}

.menu-label {
  white-space: nowrap;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.sidebar.collapsed .menu-label {
  opacity: 0;
  visibility: hidden;
}


/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Topbar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #fff;
  padding: 15px 20px;
  border-bottom: 1px solid #e2e8f0;
}
.menu-btn {
  font-size: 20px;
  background: none;
  border: none;
  cursor: pointer;
}
.page-title {
  font-size: 20px;
  font-weight: 500;
}
.topbar-actions {
  display: flex;
  gap: 15px;
  align-items: center;
}
.logout-btn {
  padding: 6px 12px;
  background-color: #ef4444;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* Content */
.content {
  padding: 30px;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0;
    left: -220px; /* hidden by default */
    width: 220px;
    height: 100vh;
    z-index: 1000;
    transition: left 0.3s ease-in-out;
    box-shadow: 2px 0 8px rgba(0, 0, 0, 0.15);
  }

  .sidebar.mobile-open {
    left: 0;
  }

  .overlay {
    display: none;
  }

  .overlay.active {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 100vw;
    background-color: rgba(0, 0, 0, 0.4);
    z-index: 999;
  }

  .main {
    width: 100%;
    margin-left: 0;
  }

  .topbar {
    flex-wrap: wrap;
    padding: 10px;
  }

  .page-title {
    font-size: 18px;
    margin-top: 8px;
  }

  .topbar-actions {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .menu-btn {
    font-size: 22px;
  }

  .sidebar .menu-label {
    display: inline-block;
    font-size: 16px;
  }

  nav a {
    padding: 10px 15px;
    font-size: 15px;
  }
}

  </style>
</head>

<body class="dashboard-page">
     <div class="dashboard">
    <!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">🔷 <span class="menu-label">MyApp</span></div>
  <nav>
    <a href="#"><span class="icon">🏠</span><span class="menu-label">Dashboard</span></a>
    <a href="#"><span class="icon">👥</span><span class="menu-label">Users</span></a>
    <a href="#"><span class="icon">⚙️</span><span class="menu-label">Settings</span></a>
  </nav>
</aside>

    <!-- Main content -->
    <div class="main">
      <!-- Topbar -->
      <header class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <h1 class="page-title">Dashboard</h1>
  <div class="topbar-actions">
    <span class="username">Hi, Admin</span>
    <button class="logout-btn">Logout</button>
  </div>
</header>

    <div class="overlay" id="overlay"></div>
      <!-- Page content -->
      <main class="content">
        <h2>Welcome to the dashboard!</h2>
        <p>This is your main content area.</p>
      </main>
    </div>
  </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

menuBtn.addEventListener('click', () => {
  if (window.innerWidth <= 768) {
    // Mobile: toggle full drawer
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('active');
  } else {
    // Desktop: toggle collapse mode
    sidebar.classList.toggle('collapsed');
  }
});

overlay.addEventListener('click', () => {
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('active');
});
// Close sidebar when any nav link is clicked (mobile only)
const navLinks = document.querySelectorAll('.sidebar nav a');

navLinks.forEach(link => {
  link.addEventListener('click', () => {
    if (window.innerWidth <= 768) {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
    }
  });
});

  </script>

</body>

</html>
