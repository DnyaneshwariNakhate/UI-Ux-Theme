<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Cart Button */
        .cart-btn {
            position: fixed;
            top: 60px;
            right: 20px;
            background: #00999A;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1001;
        }

        /* Drawer Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1000;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Drawer Panel */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 350px;
            max-width: 90%;
            height: 100%;
            background: #fff;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            transition: 0.3s;
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            right: 0;
        }

        /* Header */
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        /* Cart Items */
        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 10px;
            object-fit: cover;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-details h4 {
            margin: 0;
            font-size: 16px;
        }

        .cart-item-details p {
            margin: 5px 0 0;
            color: #666;
            font-size: 14px;
        }

        /* Footer */
        .cart-footer {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .checkout-btn {
            width: 100%;
            background: #00999A;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #007f80;
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <!-- <div class="card-soft p-3"> -->
                    <!-- ------------------ -->
                    <button class="cart-btn" id="cartBtn">🛒 Cart</button>

                    <!-- Overlay -->
                    <div class="overlay" id="overlay"></div>

                    <!-- Cart Drawer -->
                    <div class="cart-drawer" id="cartDrawer">
                        <div class="cart-header">
                            <span>Shopping Cart</span>
                            <button class="close-btn" id="closeBtn">&times;</button>
                        </div>
                        <div class="cart-items">
                            <div class="cart-item">
                                <img src="https://picsum.photos/60" alt="item">
                                <div class="cart-item-details">
                                    <h4>Product 1</h4>
                                    <p>$20</p>
                                </div>
                            </div>
                            <div class="cart-item">
                                <img src="https://picsum.photos/61" alt="item">
                                <div class="cart-item-details">
                                    <h4>Product 2</h4>
                                    <p>$15</p>
                                </div>
                            </div>
                        </div>
                        <div class="cart-footer">
                            <button class="checkout-btn">Checkout</button>
                        </div>
                    </div>
                    <!-- ------------------ -->
        </div>
        </section>
        </main>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const cartBtn = document.getElementById("cartBtn");
        const cartDrawer = document.getElementById("cartDrawer");
        const closeBtn = document.getElementById("closeBtn");
        const overlay = document.getElementById("overlay");

        cartBtn.addEventListener("click", () => {
            cartDrawer.classList.add("active");
            overlay.classList.add("active");
        });

        closeBtn.addEventListener("click", () => {
            cartDrawer.classList.remove("active");
            overlay.classList.remove("active");
        });

        overlay.addEventListener("click", () => {
            cartDrawer.classList.remove("active");
            overlay.classList.remove("active");
        });
    </script>
</body>

</html>
