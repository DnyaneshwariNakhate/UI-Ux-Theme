<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  .footer-row{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;padding:14px 20px;background:#f8f9fb;color:#3a3f45;
    font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
  }
  @media (prefers-color-scheme: dark){
    .footer-row{background:#0f1115;color:#e6e8eb}
  }
  .links{display:flex;gap:14px}
  .links a{color:inherit;text-decoration:none}
  .links a:hover{text-decoration:underline}
  .copy{margin:0;opacity:.8}
  @media (max-width:560px){
    .footer-row{flex-direction:column}
  }
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
            <footer class="footer-row" role="contentinfo">
                <nav class="links" aria-label="Footer">
                    <a href="/privacy">Privacy</a>
                    <a href="/terms">Terms</a>
                </nav>
                <p class="copy">© <span id="y"></span> Your Company</p>
            </footer>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
 
</body>

</html>
