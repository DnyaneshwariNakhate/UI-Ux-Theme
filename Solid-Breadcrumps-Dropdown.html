<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
   <style>
.breadcrumb {
  font-family: Poppins, sans-serif;
  font-size: 14px;
}

.breadcrumb ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  gap: 8px;
  align-items: center;
}

.breadcrumb li {
  position: relative;
   display: flex;  
  align-items: center; 
}

.breadcrumb a, .dropbtn {
  text-decoration: none;
  color: #007bff;
  background: none;
  border: none;
  cursor: pointer;
  font-weight: 500;
  display: inline-block; 
  line-height: 1.2;
}

.breadcrumb li[aria-current="page"] {
  color: #555;
  cursor: default;
  font-weight: 600;
}

.breadcrumb li:not(:last-child)::after {
  content: ">";
  margin-left: 8px;
  color: #999;
  display: inline-block; /* ensure it's inline */
  line-height: 1;        /* keep it tight */
}

/* Dropdown Styles */
.dropdown-menu {
    display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  border-radius: 4px;
  min-width: 150px;
  display: none;
  flex-direction: column;
  padding: 8px 0;
  z-index: 1000;
}

.dropdown-menu li {
  padding: 8px 16px;
}

.dropdown-menu li a {
  color: #333;
  display: block;
}

.dropdown-menu li:hover {
  background-color: #f0f0f0;
}
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <nav aria-label="breadcrumb" class="breadcrumb">
                            <ul>
                                <li><a href="#">Home</a></li>
                                <li class="dropdown">
                                    <button class="dropbtn" aria-haspopup="true" aria-expanded="false">
                                        Category ▼
                                    </button>
                                    <ul class="dropdown-menu" role="menu" aria-label="Category submenu">
                                        <li><a href="#">Category 1</a></li>
                                        <li><a href="#">Category 2</a></li>
                                        <li><a href="#">Category 3</a></li>
                                    </ul>
                                </li>
                                <li><a href="#">Subcategory</a></li>
                                <li aria-current="page">Product</li>
                            </ul>
                        </nav>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
<script>
   window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.dropdown-menu').forEach(menu => {
    menu.style.display = 'none';
    if(menu.previousElementSibling) {
      menu.previousElementSibling.setAttribute('aria-expanded', 'false');
    }
  });
});

document.querySelectorAll('.dropbtn').forEach(button => {
  button.addEventListener('click', (e) => {
    e.stopPropagation();
    const dropdown = button.nextElementSibling;
    const isVisible = dropdown.style.display === 'flex';

    // Close all dropdowns
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
      menu.style.display = 'none';
      menu.previousElementSibling.setAttribute('aria-expanded', 'false');
    });

    if (!isVisible) {
      dropdown.style.display = 'flex';
      button.setAttribute('aria-expanded', 'true');
    }
  });
});


</script>
</body>

</html>
