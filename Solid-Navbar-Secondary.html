<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .top-bar {
            background-color: #f5f5f5;
            color: #333;
            font-size: 14px;
            border-bottom: 1px solid #ddd;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .top-bar .left,
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-bar i {
            margin-right: 5px;
        }

        .lang-select,
        .dark-mode,
        .login-signup {
            cursor: pointer;
        }

        .hamburger {
            display: none;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .top-bar .left {
                display: none;
            }

            .top-bar .right {
                display: none;
            }

            .hamburger {
                display: block;
            }

            .top-bar.active .right {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 40px;
                right: 0;
                background: #f5f5f5;
                width: 100%;
                padding: 10px 20px;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <div class="top-bar" id="topBar">
                            <div class="left">
                                <span><i>📞</i> Call us: +1-800-123-4567</span>
                                <span><i>📧</i> support@example.com</span>
                            </div>

                            <div class="right">
                                <span class="lang-select">EN ⏷</span>
                                <!-- <span class="dark-mode">🌙</span> -->
                                <span class="login-signup">Login | Sign Up</span>
                            </div>

                            <div class="hamburger" id="hamburger">☰</div>
                        </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const topBar = document.getElementById('topBar');

        hamburger.addEventListener('click', () => {
            topBar.classList.toggle('active');
        });
    </script>

</body>

</html>
