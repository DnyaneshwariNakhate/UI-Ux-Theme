<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View User Details</title>
  <link rel="stylesheet" href="Site.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      /* font-family: 'Poppins', sans-serif; */
      padding: 0px;
    }
   
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <span style="color: #1b1b1b; font-weight: bold;">User Details</span>
        <p class="subheader" style="margin-bottom: 0px;">Get a closer look at the complete information.</p>
        <!-- <a href="index.html" class="btn btn-sm btn-light">← Back</a> -->
      </div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-4 label">ID</div>
          <div class="col-md-8 value">1</div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4 label">Name</div>
          <div class="col-md-8 value">johndoe</div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4 label">Email</div>
          <div class="col-md-8 value">johndoe@mail.com</div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4 label">Role</div>
          <div class="col-md-8 value">Manager</div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4 label">Created Date</div>
          <div class="col-md-8 value">15-09-2025</div>
        </div>
      </div>
      <div class="card-footer text-center">
        <a href="NewTable.html" class="btn btn-back">Back to Table</a>
      </div>
    </div>
  </div>
</body>
</html>
