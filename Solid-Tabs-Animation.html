<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
  body {
  font-family: Poppins, sans-serif;
  margin: 0;
  background: #f9f9f9;
}

.tabs-container {
  width: 100%;
  padding: 20px;
  box-sizing: border-box;
}

.tabs {
  display: flex;
  position: relative;
  border-bottom: 1px solid #ddd;
}

.tab {
  background: none;
  border: none;
  outline: none;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  color: #555;
  position: relative;
}

.tab:hover {
  color: #00999A;
}

.tab.active {
  color: #00999A;
}

.underline {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  width: 0;
  background-color: #00999A;
  transition: all 0.3s ease;
}

.tabs-dropdown {
  display: none;
  padding: 8px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

/* Mobile view */
@media (max-width: 600px) {
  .tabs {
    display: none;
  }
  .tabs-dropdown {
    display: block;
    width: 100%;
  }
}
 </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                       <div class="tabs-container">
  <!-- Mobile Menu -->
  <select class="tabs-dropdown" id="tabsDropdown">
    <option value="0">Overview</option>
    <option value="1">Features</option>
    <option value="2">Pricing</option>
    <option value="3">Contact</option>
  </select>

  <!-- Desktop Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active">Overview</button>
    <button class="tab">Features</button>
    <button class="tab">Pricing</button>
    <button class="tab">Contact</button>
    <div class="underline"></div>
  </div>
</div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
  <script>
  const tabs = document.querySelectorAll('.tab');
const underline = document.querySelector('.underline');
const dropdown = document.getElementById('tabsDropdown');

function updateUnderline(element) {
  underline.style.width = element.offsetWidth + 'px';
  underline.style.left = element.offsetLeft + 'px';
}

// Desktop tab click
tabs.forEach((tab, index) => {
  tab.addEventListener('click', () => {
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    updateUnderline(tab);
    dropdown.value = index; // Sync with mobile menu
  });
});

// Mobile dropdown change
dropdown.addEventListener('change', (e) => {
  const index = e.target.value;
  document.querySelector('.tab.active').classList.remove('active');
  tabs[index].classList.add('active');
  updateUnderline(tabs[index]);
});

// Initialize underline on page load
window.addEventListener('load', () => {
  const activeTab = document.querySelector('.tab.active');
  updateUnderline(activeTab);
});
 </script>
</body>

</html>
