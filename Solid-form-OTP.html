<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
        font-family: 'Poppins', sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        /* height: 100vh; */
        margin: 0;
    }
    .otp-container {
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        max-width: 420px;
        width: 90%;
    }
    .logo {
        text-align: center;
        margin-bottom: 1rem;
    }
    .logo img {
        width: 50px;
        height: auto;
    }
    h2 {
        text-align: center;
        margin-bottom: 0.5rem;
        color: #333;
    }
    p {
        text-align: center;
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 1.5rem;
    }
    .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 1rem;
    }
    .input-group select, .input-group input {
        padding: 0.8rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
    }
    .input-group select {
        width: 30%;
    }
    .input-group input {
        flex: 1;
    }
    .otp-inputs {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
    }
    .otp-inputs input {
        width: 3rem;
        height: 3rem;
        text-align: center;
        font-size: 1.2rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .otp-inputs input:focus {
        border-color: #00999A;
        box-shadow: 0 0 4px rgba(0,153,154,0.3);
    }
    .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        font-size: 0.9rem;
    }
    .actions a {
        color: #00999A;
        text-decoration: none;
    }
    .actions a:hover {
        text-decoration: underline;
    }
    .btn {
        width: 100%;
        padding: 0.8rem;
        font-size: 1rem;
        background: #00999A;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }
    .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    .btn:hover:enabled {
        background: #007f80;
    }
    .message {
        text-align: center;
        font-size: 0.9rem;
        margin-top: 1rem;
    }
    .message.error {
        color: #d82c37;
    }
    .message.success {
        color: #00999A;
    }
    @media (max-width: 480px) {
        .input-group {
            flex-direction: column;
        }
        .input-group select {
            width: 100%;
        }
    }
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                      <div class="otp-container">
    <div class="logo">
        <img src="https://via.placeholder.com/50" alt="Logo">
    </div>
    <h2>Verify Your Number</h2>
    <p>We’ve sent an OTP to <strong id="masked-number">+91 98765 43210</strong></p>

    <!-- Mobile number input -->
    <div class="input-group">
        <select>
            <option value="+91">+91</option>
            <option value="+1">+1</option>
            <option value="+44">+44</option>
        </select>
        <input type="tel" placeholder="Enter mobile number" maxlength="15">
    </div>

    <!-- OTP inputs -->
    <div class="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
    </div>

    <!-- Resend link with timer -->
    <div class="actions">
        <span id="timer">Resend in 30s</span>
        <a href="#" id="resend" style="display:none;">Resend OTP</a>
    </div>

    <!-- Verify button -->
    <button class="btn" id="verify-btn" disabled>Verify</button>

    <!-- Message -->
    <div id="message" class="message"></div>
</div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
   <script>
    // Auto-focus & move to next field
    const otpInputs = document.querySelectorAll('.otp-inputs input');
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            checkOTPComplete();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    // Enable verify button when OTP complete
    function checkOTPComplete() {
        const allFilled = Array.from(otpInputs).every(input => input.value.trim() !== '');
        document.getElementById('verify-btn').disabled = !allFilled;
    }

    // Resend timer
    let timeLeft = 30;
    const timerEl = document.getElementById('timer');
    const resendEl = document.getElementById('resend');
    const timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `Resend in ${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerEl.style.display = 'none';
            resendEl.style.display = 'inline';
        }
    }, 1000);

    // Resend click
    resendEl.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('message').textContent = 'OTP sent again!';
        document.getElementById('message').className = 'message success';
    });

    // Verify button click
    document.getElementById('verify-btn').addEventListener('click', () => {
        const otp = Array.from(otpInputs).map(input => input.value).join('');
        if (otp === '1234') { // Example correct OTP
            document.getElementById('message').textContent = 'OTP verified successfully!';
            document.getElementById('message').className = 'message success';
        } else {
            document.getElementById('message').textContent = 'Invalid OTP. Please try again.';
            document.getElementById('message').className = 'message error';
        }
    });
</script>
</body>

</html>
