<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding-bottom: 60px; /* prevent content from hiding under footer */
    font-family: Arial, sans-serif;
  }

  .content {
    padding: 20px;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #00999A;
    color: white;
    text-align: center;
    padding: 15px 10px;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    font-weight: bold;
  }

  .footer .cta {
    background: white;
    color: #00999A;
    padding: 8px 15px;
    border-radius: 5px;
    font-weight: bold;
    margin-right: 20px;
  }

  .footer .cta:hover {
    background: #e6f7f7;
  }
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
           <div class="content">
  <h1>Sticky Footer Demo</h1>
  <p>Scroll down to see that the footer stays fixed at the bottom.</p>
  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Mauris vel tortor vel ligula cursus volutpat...</p>
</div>

<div class="footer">
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
  <a href="#" class="cta">Sign Up</a>
</div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
 
</body>

</html>
