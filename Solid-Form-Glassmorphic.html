<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark-1: #081021;
            --bg-dark-2: #0b1020;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #1BC2DD;
            /* change as needed */
            --accent-2: #00999A;
            --text: #E7F1F7;
            --muted: #9FB3C8;
            --danger: #ff6b6b;
            --card-width: 420px;
            --card-radius: 16px;
        }

        /* Dark mode detection: invert glass slightly for light mode if user chooses light */
        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.6);
                --glass-border: rgba(0, 0, 0, 0.06);
                --text: #0b1b2b;
                --muted: #5b6b7b;
                --bg-dark-1: #eaeff4;
                --bg-dark-2: #dbe6f0;
            }
        }

        /* Reset + base */
        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(120deg, var(--bg-dark-1), var(--bg-dark-2));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background video / fallback cover */
        .bg-media {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-media video,
        .bg-media .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            filter: brightness(0.45) saturate(1.05) contrast(1);
            object-fit: cover;
        }

        .bg-media .bg-image {
            background-image: linear-gradient(135deg, rgba(10, 15, 25, 0.5), rgba(10, 25, 35, 0.6)), url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1600&auto=format&fit=crop&ixlib=rb-4.0.3&s=');
            background-size: cover;
            background-position: center;
            inset: 0;
            transform: none;
            width: 100%;
            height: 100%;
        }

        /* Center container */
        .login-wrap {
            position: relative;
            z-index: 5;
            width: calc(100% - 48px);
            max-width: var(--card-width);
            margin: auto;
            padding: 28px;
            border-radius: var(--card-radius);
            backdrop-filter: blur(10px) saturate(120%);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: transform .28s ease, box-shadow .28s ease;
        }

        .login-wrap:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(2, 6, 23, 0.8)
        }

        /* Header */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(25, 55, 80, 0.25);
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.2px;
            font-weight: 600
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px
        }

        label {
            font-size: 13px;
            color: var(--muted);
            display: block;
            margin-bottom: 6px
        }

        .input {
            position: relative;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: var(--text);
            outline: none;
            font-size: 15px;
            transition: box-shadow .18s ease, border-color .18s ease;
        }

        input:focus {
            box-shadow: 0 6px 20px rgba(27, 194, 221, 0.08);
            border-color: var(--accent)
        }

        /* password toggle */
        .toggle-pass {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }

        .toggle-pass:focus {
            outline: 2px solid rgba(27, 194, 221, 0.18)
        }

        /* Actions row */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 6px;
        }

        .checkbox-area {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted)
        }

        .checkbox-area input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent)
        }

        button.btn {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #04202a;
            /* dark text on neon bg */
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 24px rgba(27, 194, 221, 0.12);
            min-width: 140px;
        }

        button.btn:disabled {
            opacity: 0.6;
            cursor: not-allowed
        }

        .link {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        /* Divider for social buttons */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent)
        }

        .divider span {
            font-size: 13px;
            color: var(--muted)
        }

        /* Social buttons */
        .socials {
            display: flex;
            gap: 10px
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        /* Small print and 404-style link */
        .small {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            margin-top: 6px
        }

        /* Responsive: small screens, card becomes almost full width and spacing increases */
        @media (max-width:520px) {
            body {
                padding: 18px 0;
            }

            .login-wrap {
                width: 100%;
                max-width: 100%;
                margin: 18px;
                padding: 20px;
                border-radius: 14px;
            }

            .brand-logo {
                width: 44px;
                height: 44px
            }

            .brand h1 {
                font-size: 16px
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px
            }

            button.btn {
                width: 100%;
                min-width: unset
            }
        }

        /* Accessibility: focus outline for keyboard users */
        :focus {
            outline-offset: 3px;
        }

        input:focus,
        button:focus,
        a:focus {
            outline: 2px solid rgba(27, 194, 221, 0.12);
            border-radius: 8px;
        }

        /* Error styles */
        .field-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 6px;
        }

        .invalid {
            border-color: rgba(255, 107, 107, 0.9);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.06)
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <!-- Background video -->
                        <div class="bg-media" aria-hidden="true">
                            <video autoplay muted loop playsinline
                                poster="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1600&auto=format&fit=crop&ixlib=rb-4.0.3&s=">
                                <!-- replace with your mp4 / webm for best results -->
                                <source src="https://cdn.coverr.co/videos/coverr-abstract-roads-1586?token="
                                    type="video/mp4">
                                <!-- If video fails, show image fallback -->
                                <div class="bg-image" role="img" aria-label="Decorative blurred background image"></div>
                            </video>
                        </div>

                        <!-- Login card -->
                        <main class="login-wrap" role="main" aria-labelledby="login-heading">
                            <header class="brand" aria-hidden="false">
                                <div class="brand-logo" aria-hidden="true">E</div>
                                <div>
                                    <h1 id="login-heading">Welcome back</h1>
                                    <p>Sign in to continue to your creative space</p>
                                </div>
                            </header>

                            <!-- Social logins (optional) -->
                            <div>
                                <div class="divider"><span>Sign in</span></div>

                                <div class="socials" role="group" aria-label="Social sign in options">
                                    <button class="social-btn" type="button"
                                        aria-label="Sign in with Google">Google</button>
                                    <button class="social-btn" type="button"
                                        aria-label="Sign in with GitHub">GitHub</button>
                                </div>
                            </div>

                            <form id="loginForm" novalidate>
                                <div>
                                    <label for="email">Email</label>
                                    <div class="input">
                                        <input id="email" name="email" type="email" inputmode="email"
                                            autocomplete="email" placeholder="you@company.com" required
                                            aria-describedby="emailError">
                                    </div>
                                    <div id="emailError" class="field-error" aria-live="polite"></div>
                                </div>

                                <div>
                                    <label for="password">Password</label>
                                    <div class="input" style="position:relative">
                                        <input id="password" name="password" type="password"
                                            autocomplete="current-password" placeholder="Enter your password" required
                                            minlength="6" aria-describedby="passError">
                                        <button type="button" class="toggle-pass" aria-pressed="false"
                                            aria-label="Show password" id="togglePass">Show</button>
                                    </div>
                                    <div id="passError" class="field-error" aria-live="polite"></div>
                                </div>

                                <div class="actions">
                                    <div class="checkbox-area">
                                        <input id="remember" name="remember" type="checkbox" />
                                        <label for="remember" style="margin:0">Remember me</label>
                                    </div>

                                    <a class="link" href="#" id="forgotLink">Forgot password?</a>
                                </div>

                                <div style="display:flex; gap:12px; align-items:center; margin-top:6px;">
                                    <button class="btn" id="submitBtn" type="submit">Sign in</button>
                                    <a class="link" href="#" style="align-self:center; font-size:14px;">Create
                                        account</a>
                                </div>
                            </form>

                            <!-- <div class="small" aria-hidden="true">Secure login • Built with glassmorphism • Dark mode friendly</div> -->
                        </main>

                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        // Minimal JS: toggle password & client-side validation
        (function () {
            const toggle = document.getElementById('togglePass');
            const password = document.getElementById('password');
            const form = document.getElementById('loginForm');
            const email = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const passError = document.getElementById('passError');
            const submitBtn = document.getElementById('submitBtn');

            toggle.addEventListener('click', () => {
                const isHidden = password.type === 'password';
                password.type = isHidden ? 'text' : 'password';
                toggle.textContent = isHidden ? 'Hide' : 'Show';
                toggle.setAttribute('aria-pressed', String(isHidden));
                toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                password.focus();
            });

            // Lightweight validation
            function validateEmail(value) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
            }

            function clearErrors() {
                emailError.textContent = '';
                passError.textContent = '';
                email.classList.remove('invalid');
                password.classList.remove('invalid');
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                clearErrors();

                let ok = true;
                if (!email.value.trim() || !validateEmail(email.value.trim())) {
                    emailError.textContent = 'Please enter a valid email address.';
                    email.classList.add('invalid');
                    ok = false;
                }
                if (!password.value || password.value.length < 6) {
                    passError.textContent = 'Password must be at least 6 characters.';
                    password.classList.add('invalid');
                    ok = false;
                }

                if (!ok) {
                    // focus first invalid
                    const first = document.querySelector('.invalid');
                    if (first) first.focus();
                    return;
                }

                // Demo: disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                // Simulate network request (replace with real auth)
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                    // For demo: simple success flow
                    alert('Logged in (demo). Replace with real authentication.');
                    form.reset();
                }, 1000);
            });

        })();
    </script>
</body>

</html>
