<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
   <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
    }

    /* Banner Styles */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #2b2b2b;
      color: #fff;
      padding: 15px 0px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .cookie-banner p {
      margin: 0;
      flex: 1;
      font-size: 14px;
    }

    .cookie-banner a {
      color: #1bc2dd;
      text-decoration: underline;
    }

    .cookie-buttons {
      display: flex;
      gap: 10px;
    }

    .cookie-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .accept-btn {
      background: #00999a;
      color: white;
    }

    .decline-btn {
      background: #444;
      color: white;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .cookie-banner {
        flex-direction: column;
        text-align: center;
      padding: 8px;

      }
      .cookie-buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <div class="cookie-banner" id="cookieBanner">
                            <p>
                                We use cookies to improve your experience. By using our site, you agree to our
                                <a href="#">Privacy Policy</a>.
                            </p>
                            <div class="cookie-buttons">
                                <button class="cookie-btn decline-btn" id="declineCookies">Decline</button>
                                <button class="cookie-btn accept-btn" id="acceptCookies">Accept</button>
                            </div>
                        </div>
                
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
    const banner = document.getElementById("cookieBanner");
    const acceptBtn = document.getElementById("acceptCookies");
    const declineBtn = document.getElementById("declineCookies");

    // Check if cookies already accepted/declined
    if (localStorage.getItem("cookieConsent")) {
      // banner.style.display = "none";
    }

    acceptBtn.addEventListener("click", () => {
      localStorage.setItem("cookieConsent", "accepted");
      banner.style.display = "none";
    });

    declineBtn.addEventListener("click", () => {
      localStorage.setItem("cookieConsent", "declined");
      banner.style.display = "none";
    });
  </script>

</body>

</html>
