<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .breadcrumb {
            font-family: Poppins, sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .breadcrumb ul {
            list-style: none;
            display: flex;
            padding: 0;
            margin: 0;
            gap: 8px;
            flex-wrap: nowrap;
            overflow: hidden;
            white-space: nowrap;
        }

        .breadcrumb li {
            display: flex;
            align-items: center;
        }

        .breadcrumb li+li::before {
            content: "›";
            margin: 0 8px;
            color: #999;
        }

        .breadcrumb a {
            text-decoration: none;
            color: #007BFF;
            cursor: pointer;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb li[aria-current="page"] {
            color: #333;
            font-weight: 600;
            cursor: default;
        }

        /* Ellipsis style */
        .overflow-ellipsis {
            cursor: default;
            user-select: none;
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <nav aria-label="breadcrumb" class="breadcrumb">
                            <ul id="breadcrumb-list">
                                <li><a href="#">Home</a></li>
                                <li><a href="#">Category</a></li>
                                <li><a href="#">Subcategory</a></li>
                                <li><a href="#">Section</a></li>
                                <li><a href="#">Subsection</a></li>
                                <li><a href="#">Topic</a></li>
                                <li class="overflow-ellipsis">…</li>
                                <li><a href="#">Subcategory</a></li>
                                <li aria-current="page">Product</li>
                            </ul>
                        </nav>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const breadcrumbList = document.getElementById('breadcrumb-list');
        const maxVisibleItems = 5;

        function updateBreadcrumb() {
            const items = breadcrumbList.querySelectorAll('li:not(.overflow-ellipsis)');

            if (items.length <= maxVisibleItems) {
                // No need to collapse
                breadcrumbList.querySelector('.overflow-ellipsis').style.display = 'none';
                items.forEach(item => item.style.display = 'flex');
            } else {
                breadcrumbList.querySelector('.overflow-ellipsis').style.display = 'flex';

                // Show first 2 items, ellipsis, last 2 items
                items.forEach((item, index) => {
                    if (index < 2 || index >= items.length - 2) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }
        }

        // Run on page load
        updateBreadcrumb();
    </script>

</body>

</html>
