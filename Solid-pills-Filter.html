<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Poppins, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f9f9f9;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
            /* Firefox */
        }

        .filter-container::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari */
        }

        .filter-pill {
            padding: 8px 16px;
            border-radius: 25px;
            border: 1px solid #ccc;
            background: white;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-pill:hover {
            background: #f0f0f0;
        }

        .filter-pill.active {
            background: #00999A;
            color: white;
            border-color: #00999A;
        }

        /* Mobile Menu Button */
        .mobile-toggle {
            display: none;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #00999A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .mobile-toggle {
                display: block;
            }

            .filter-container {
                display: none;
            }

            .filter-container.open {
                display: flex;
                flex-wrap: wrap;
                overflow-x: visible;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <!-- Mobile Toggle -->
                        <button class="mobile-toggle">Show Filters</button>

                        <!-- Filter Pills -->
                        <div class="filter-container">
                            <div class="filter-pill active">All</div>
                            <div class="filter-pill">UI Design</div>
                            <div class="filter-pill">Development</div>
                            <div class="filter-pill">Marketing</div>
                            <div class="filter-pill">Branding</div>
                            <div class="filter-pill">E-commerce</div>
                        </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        // Toggle mobile filter menu
        const toggleBtn = document.querySelector('.mobile-toggle');
        const filterContainer = document.querySelector('.filter-container');

        toggleBtn.addEventListener('click', () => {
            filterContainer.classList.toggle('open');
            toggleBtn.textContent = filterContainer.classList.contains('open')
                ? 'Hide Filters'
                : 'Show Filters';
        });

        // Activate pills on click (single selection)
        const pills = document.querySelectorAll('.filter-pill');
        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                // For single selection mode
                pills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
            });
        });

        // If you want multi-select mode, replace the event with:
        /*
        pill.addEventListener('click', () => {
          pill.classList.toggle('active');
        });
        */
    </script>
</body>

</html>
