<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
 <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #f5f7fa, #e4ebf0);
  display: flex;
  justify-content: center;
  align-items: center;
  /* min-height: 100vh; */
}

.login-container {
  width: 100%;
  padding: 20px;
}

.login-card {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  max-width: 380px;
  margin: auto;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.08);
}

.login-card h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

.social-login {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social-btn {
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
  color: #000000;
  border: 1px solid #ddd;
  background: transparent;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}

.social-btn i {
  font-size: 16px;
}

.google {
  /* background-color: #DB4437; */
}

.microsoft {
  /* background-color: #2F2F2F; */
}

.apple {
  /* background-color: #000; */
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 20px 0;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #ccc;
}

.divider span {
  padding: 0 10px;
  font-size: 14px;
  color: #777;
}

form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

form input {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}

.login-btn {
  background-color: #00999A;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}

.forgot {
  display: block;
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #00999A;
  text-decoration: none;
}

.forgot:hover {
  text-decoration: underline;
}

/* Responsive Design */
@media (max-width: 480px) {
  .login-card {
    padding: 20px;
  }
}
</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                    <div class="login-container">
                        <div class="login-card">
                            <h2>Welcome Back</h2>
                    
                            <!-- Social Login Buttons -->
                            <div class="social-login">
                                <button class="social-btn google">
                                    <i class="ri-google-fill"></i>
                                    Continue with Google
                                </button>
                                <button class="social-btn microsoft">
                                   <i class="ri-microsoft-fill"></i>
                                    Continue with Microsoft
                                </button>
                                <button class="social-btn apple">
                                    <i class="ri-apple-fill"></i>
                                    Continue with Apple
                                </button>
                            </div>
                    
                            <div class="divider">
                                <span>or login with email</span>
                            </div>
                    
                            <!-- Email/Password Form -->
                            <form>
                                <input type="email" placeholder="Email" required />
                                <input type="password" placeholder="Password" required />
                                <button type="submit" class="login-btn">Login</button>
                            </form>
                    
                            <a href="#" class="forgot">Forgot Password?</a>
                        </div>
                    </div>

                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
 
</body>

</html>
