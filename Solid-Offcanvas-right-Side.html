<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Button */
        .settings-btn {
            position: fixed;
            top: 62px;
            right: 20px;
            background: #00999A;
            color: #fff;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 6px;
            z-index: 1001;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Drawer */
        .drawer {
            position: fixed;
            top: 0;
            right: -350px;
            /* hidden initially */
            width: 300px;
            max-width: 80%;
            height: 100%;
            background: #fff;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease;
            z-index: 1002;
            display: flex;
            flex-direction: column;
        }

        .drawer.active {
            right: 0;
        }

        /* Drawer Header */
        .drawer-header {
            padding: 16px;
            background: #00999A;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: white;
            cursor: pointer;
        }

        /* Drawer Content */
        .drawer-content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .drawer-content label {
            display: block;
            margin: 12px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .drawer-content input,
        .drawer-content select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <!-- <div class="card-soft p-3"> -->
                    <!-- ------------------ -->
                    <!-- Settings Button -->
                    <button class="settings-btn" id="openDrawer">⚙ Settings</button>

                    <!-- Overlay -->
                    <div class="overlay" id="overlay"></div>

                    <!-- Drawer -->
                    <div class="drawer" id="drawer">
                        <div class="drawer-header">
                            <h2>Settings</h2>
                            <button class="close-btn" id="closeDrawer">&times;</button>
                        </div>
                        <div class="drawer-content">
                            <label for="theme">Theme</label>
                            <select id="theme">
                                <option>Light</option>
                                <option>Dark</option>
                            </select>

                            <label for="notifications">Notifications</label>
                            <input type="checkbox" id="notifications"> Enable notifications

                            <label for="lang">Language</label>
                            <select id="lang">
                                <option>English</option>
                                <option>Hindi</option>
                                <option>Spanish</option>
                            </select>
                        </div>
                    </div>
                    <!-- ------------------ -->
        </div>
        </section>
        </main>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const openBtn = document.getElementById('openDrawer');
        const closeBtn = document.getElementById('closeDrawer');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');

        openBtn.addEventListener('click', () => {
            drawer.classList.add('active');
            overlay.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', () => {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        });
    </script>
</body>

</html>
