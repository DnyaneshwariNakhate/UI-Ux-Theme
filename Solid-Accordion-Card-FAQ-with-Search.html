<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .faq-container {
            max-width: 700px;
            margin: 0 auto;
            font-family: Poppins, sans-serif;
        }

        #faq-search {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .accordion-item {
            border-bottom: 1px solid #ddd;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 16px;
            font-size: 18px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s ease;
        }

        .accordion-header:hover,
        .accordion-header[aria-expanded="true"] {
            background-color: #e0f7fa;
        }

        .accordion-content {
            padding: 0 16px 16px;
            font-size: 16px;
            line-height: 1.4;
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <div class="faq-container">
                            <input type="text" id="faq-search" placeholder="Search FAQs..." aria-label="Search FAQs" />

                            <div class="accordion" id="faq-accordion">
                                <div class="accordion-item">
                                    <button class="accordion-header" aria-expanded="false">
                                        What is your return policy?
                                    </button>
                                    <div class="accordion-content" hidden>
                                        Our return policy lasts 30 days...
                                    </div>
                                </div>

                                <div class="accordion-item">
                                    <button class="accordion-header" aria-expanded="false">
                                        How long does shipping take?
                                    </button>
                                    <div class="accordion-content" hidden>
                                        Shipping usually takes 5-7 business days...
                                    </div>
                                </div>

                                <div class="accordion-item">
                                    <button class="accordion-header" aria-expanded="false">
                                        Do you ship internationally?
                                    </button>
                                    <div class="accordion-content" hidden>
                                        Yes, we ship to most countries worldwide...
                                    </div>
                                </div>

                                <!-- Add more FAQ items as needed -->
                            </div>
                        </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const searchInput = document.getElementById('faq-search');
        const accordionItems = document.querySelectorAll('.accordion-item');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();

            accordionItems.forEach(item => {
                const header = item.querySelector('.accordion-header').textContent.toLowerCase();
                const content = item.querySelector('.accordion-content').textContent.toLowerCase();

                if (header.includes(query) || content.includes(query)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Accordion toggle logic
        accordionItems.forEach(item => {
            const header = item.querySelector('.accordion-header');
            const content = item.querySelector('.accordion-content');

            header.addEventListener('click', () => {
                const expanded = header.getAttribute('aria-expanded') === 'true';
                header.setAttribute('aria-expanded', !expanded);
                content.hidden = expanded;
            });
        });
    </script>
</body>

</html>
