<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #00999A;
            color: white;
            margin: 20px;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Dialog Box */
        .dialog {
            background: #fff;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease;
        }

        .dialog h3 {
            margin: 0 0 15px;
            font-size: 20px;
            font-weight: 600;
        }

        .dialog p {
            font-size: 16px;
            margin: 0 0 20px;
            color: #444;
        }

        .dialog-buttons {
            display: flex;
            justify-content: space-around;
            /* gap: 15px; */
        }

        .dialog button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-yes {
            background: #00999A;
            color: #fff;
        }

        .btn-yes:hover {
            background: #007d7e;
        }

        .btn-no {
            background: #ddd;
            color: #333;
        }

        .btn-no:hover {
            background: #bbb;
        }

        @keyframes fadeIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <button id="openDialog">Delete Item</button>

                        <!-- Overlay & Dialog -->
                        <div class="overlay" id="dialogOverlay">
                            <div class="dialog">
                                <h3>Are you sure?</h3>
                                <p>Do you really want to delete this item? This action cannot be undone.</p>
                                <div class="dialog-buttons">
                                    <button class="btn-yes" id="confirmYes">Yes</button>
                                    <button class="btn-no" id="confirmNo">No</button>
                                </div>
                            </div>
                        </div>

                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const openBtn = document.getElementById("openDialog");
        const overlay = document.getElementById("dialogOverlay");
        const btnYes = document.getElementById("confirmYes");
        const btnNo = document.getElementById("confirmNo");

        openBtn.addEventListener("click", () => {
            overlay.style.display = "flex";
        });

        btnNo.addEventListener("click", () => {
            overlay.style.display = "none";
        });

        btnYes.addEventListener("click", () => {
            alert("Item deleted!");
            overlay.style.display = "none";
        });
    </script>
</body>

</html>
