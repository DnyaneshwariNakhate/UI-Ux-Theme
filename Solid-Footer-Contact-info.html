<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  .contact-footer {
    background: #f5f5f5;
    color: #333;
    font-family: Poppins, sans-serif;
    padding-top: 30px;
  }
  .footer-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 0 120px;
    gap: 20px;
  }
  .footer-section {
    flex: 1 1 300px;
  }
  .footer-section h3, .footer-section h4 {
    margin-bottom: 10px;
    color: #00999A;
  }
  .footer-section p {
    margin: 5px 0;
    font-size: 14px;
    line-height: 1.5;
  }
  iframe {
    border-radius: 8px;
  }
  .footer-bottom {
    background: #e0e0e0;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
    font-size: 14px;
  }
  @media (max-width: 768px) {
  .footer-container {
    padding: 0 20px;
  }
  .footer-section {
    text-align: center;
  }
}

</style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                     <footer class="contact-footer">
  <div class="footer-container">
    <!-- Left: Brand & About -->
    <div class="footer-section">
      <h3>MyCompany</h3>
      <p>Delivering quality services since 2010. We help you grow your business with innovative solutions.</p>
    </div>

    <!-- Middle: Contact Info -->
    <div class="footer-section">
      <h4>Contact Us</h4>
      <p>📍 711, 7th Floor, Nyati Emporius, Baner, Pune, Maharashtra</p>
      <p>📞 +91 98765 43210</p>
      <p>✉️ info@mycompany.com</p>
    </div>

    <!-- Right: Embedded Map -->
    <div class="footer-section">
      <h4>Find Us</h4>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.217!2d73.7769!3d18.5635!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z18KwMzMnNDguNiJOIDczwrA0Nic1Ni43IkU!5e0!3m2!1sen!2sin!4v0000000000"
        width="100%" height="150" style="border:0;" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <!-- Bottom Copyright -->
  <div class="footer-bottom">
    <p>© 2025 MyCompany. All rights reserved.</p>
  </div>
</footer>


                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
 
</body>

</html>
