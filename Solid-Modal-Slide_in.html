<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        button {
            margin: 20px;
            padding: 10px 20px;
            border: none;
            background: #00999A;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Overlay background */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        /* Modal Base */
        .modal {
            position: fixed!important;
            background: #fff;
            width: 80%!important;
            max-width: 400px;
            height: 100%!important;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease-in-out;
            z-index: 1000!important;
        }

        .modal-content {
            padding: 20px;
        }

        /* Slide from Left */
        .modal-left {
            top: 0!important;
            left: 0!important;
            transform: translateX(-100%)!important;
        }

        /* Slide from Right */
        .modal-right {
            top: 0!important;
            right: 0!important;
            transform: translateX(100%)!important;
        }

        /* Slide from Bottom */
        .modal-bottom {
            bottom: 0!important;
            left: 0!important;
            width: 100%!important;
            max-width: none!important;
            height: 40%!important;
            transform: translateY(100%)!important;
            border-radius: 15px 15px 0 0!important;
        }

        /* Active state */
        .modal.show {
            transform: translateX(0)!important;
        }

        .modal-bottom.show {
            transform: translateY(0)!important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modal {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <button onclick="openModal('left')">Open Left Modal</button>
                        <button onclick="openModal('right')">Open Right Modal</button>
                        <button onclick="openModal('bottom')">Open Bottom Modal</button>

                        <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>

                        <!-- Left Modal -->
                        <div class="modal modal-left" id="modal-left">
                            <div class="modal-content">
                                <h2>Left Slide Modal</h2>
                                <p>This modal slides from the left.</p>
                                <button onclick="closeModal()">Close</button>
                            </div>
                        </div>

                        <!-- Right Modal -->
                        <div class="modal modal-right" id="modal-right">
                            <div class="modal-content">
                                <h2>Right Slide Modal</h2>
                                <p>This modal slides from the right.</p>
                                <button onclick="closeModal()">Close</button>
                            </div>
                        </div>

                        <!-- Bottom Modal -->
                        <div class="modal modal-bottom" id="modal-bottom">
                            <div class="modal-content">
                                <h2>Bottom Slide Modal</h2>
                                <p>This modal slides from the bottom.</p>
                                <button onclick="closeModal()">Close</button>
                            </div>
                        </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        function openModal(position) {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('modal-' + position).classList.add('show');
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('show');
            });
        }
    </script>

</body>

</html>
