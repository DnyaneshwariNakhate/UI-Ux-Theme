<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f8f9fa;
            padding: 40px;
        }

        ul.checklist {
            list-style: none;
            padding: 0;
            max-width: 400px;
            margin: auto;
        }

        ul.checklist li {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 18px;
            cursor: pointer;
            position: relative;
        }

        /* Hide default checkbox */
        ul.checklist input[type="checkbox"] {
            display: none;
        }

        /* Custom checkbox circle */
        ul.checklist label {
            position: relative;
            padding-left: 35px;
            cursor: pointer;
            user-select: none;
        }

        ul.checklist label::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 22px;
            height: 22px;
            border: 2px solid #00999a;
            border-radius: 6px;
            background: white;
            transition: 0.3s ease;
        }

        /* Tick animation */
        ul.checklist input:checked+label::before {
            background: #00999a;
            border-color: #00999a;
        }

        ul.checklist label::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            opacity: 0;
            transform: rotate(45deg) scale(0);
            transition: 0.3s ease;
        }

        ul.checklist input:checked+label::after {
            opacity: 1;
            transform: rotate(45deg) scale(1);
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <h2>Checklist with Animated Tick</h2>
                        <ul class="checklist">
                            <li>
                                <input type="checkbox" id="task1">
                                <label for="task1">Finish the UI Design</label>
                            </li>
                            <li>
                                <input type="checkbox" id="task2">
                                <label for="task2">Update Pricing Page</label>
                            </li>
                            <li>
                                <input type="checkbox" id="task3">
                                <label for="task3">Fix Responsive Navbar</label>
                            </li>
                        </ul>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>

</body>

</html>
