<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Table Demo</title>
    <link rel="stylesheet" href="Site.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body style="background-color: #fbfbfb;">
    <div class="container-fluid">

        <!-- ===== Header Section ===== -->
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
            <div>
                <h2 class="mb-1">Manage User</h2>
                <p class="subheader text-secondary mb-0">View and Update User Information</p>
            </div>

            <!-- Right Side Buttons -->
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2 mt-md-0">
                <button class="btn btn-primary" id="addInlineBtn">+ Add Inline</button>
                <button id="addModalBtn" class="btn btn-primary">+ Add Popup</button>
                <a href="Solid -AllControlForm.html" class="btn btn-primary">+ Add Page</a>
                <button class="btn btn-outline-primary" id="exportBtn">Export</button>
                <button class="btn btn-outline-danger" id="bulkDeleteBtn">Delete Selected</button>
            </div>
        </div>

        <div style="background-color: white;padding: 24px;border-radius: 8px;">
            <!-- Filters + Search -->
            <div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-3">
                <!-- Left: Filters + Clear -->
                <div class="d-flex flex-wrap align-items-end gap-3">

                    <!-- Role Filter -->
                    <div class="d-flex flex-column">
                        <label for="roleFilter" class="form-label mb-1 fw-semibold text-secondary">Role</label>
                        <select id="roleFilter" class="form-select form-select-sm">
                            <option value="">All Roles</option>
                            <option>Admin</option>
                            <option>Manager</option>
                            <option>Employee</option>
                            <option>Intern</option>
                            <option>HR</option>
                            <option>IT</option>
                        </select>
                    </div>

                    <!-- From Date -->
                    <div class="d-flex flex-column">
                        <label for="fromDate" class="form-label mb-1 fw-semibold text-secondary">From Date</label>
                        <input type="date" id="fromDate" class="form-control form-control-sm">
                    </div>

                    <!-- To Date -->
                    <div class="d-flex flex-column">
                        <label for="toDate" class="form-label mb-1 fw-semibold text-secondary">To Date</label>
                        <input type="date" id="toDate" class="form-control form-control-sm">
                    </div>

                    <!-- Apply + Clear -->
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm" id="applyFilters">Apply</button>
                            <button class="btn btn-outline-secondary btn-sm" id="clearFilters">Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Right: Search -->
                <div style="max-width:400px; width: 100%;">
                    <input type="search" id="globalSearch" class="form-control" placeholder="Search...">
                </div>
            </div>


            <!-- ===== Filter Pills ===== -->
            <div id="filterPills" class="filter-pills mb-3"></div>
            <!-- ===== Select all message ===== -->
             <div id="selectionMessage" class="text-secondary mt-2" style="display: none;"></div>

            <!-- ===== Table ===== -->
            <div class="table-responsive" style="overflow-x: auto;">
                 <table class="table table-hover" id="demoTable" style="min-width: 1200px;">
                    <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th class="sortable" data-column="id">ID <span class="sort-icon">▲▼</span></th>
                            <th class="sortable" data-column="name">Name <span class="sort-icon">▲▼</span></th>
                            <th class="sortable" data-column="email">Email <span class="sort-icon">▲▼</span></th>
                            <th class="sortable" data-column="role">Role <span class="sort-icon">▲▼</span></th>
                            <th class="sortable" data-column="created">Created Date <span class="sort-icon">▲▼</span>
                            </th>
                            <!-- New columns -->
    <!-- <th class="sortable" data-column="department">Department <span class="sort-icon">▲▼</span></th>
    <th class="sortable" data-column="status">Status <span class="sort-icon">▲▼</span></th>
    <th class="sortable" data-column="location">Location <span class="sort-icon">▲▼</span></th> -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- ===== Pagination ===== -->
            <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
                <div>
                    Rows per page:
                    <select id="rowsPerPageSelect" class="form-select form-select-sm d-inline-block w-auto">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                    </select>
                    <span id="paginationInfo"></span>
                </div>
                <nav>
                    <ul class="pagination mb-0" id="pagination"></ul>
                </nav>
            </div>

        </div>
    </div>


    <!-- Popup Modal -->

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="addEditModal" tabindex="-1">
  <div class="modal-dialog">
    <form id="modalForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modalId">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" id="modalName" class="form-control">
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" id="modalEmail" class="form-control">
        </div>
        <div class="mb-3">
          <label>Role</label>
          <select id="modalRole" class="form-select">
            <option value="">Select Role</option>
            <option>Admin</option>
            <option>Manager</option>
            <option>Employee</option>
            <option>Intern</option>
            <option>HR</option>
            <option>IT</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Date</label>
          <input type="date" id="modalDate" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </form>
  </div>
</div>


    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this row?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Add view Popup  -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">View User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewModalBody">
                    <!-- Content will be filled dynamically -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
