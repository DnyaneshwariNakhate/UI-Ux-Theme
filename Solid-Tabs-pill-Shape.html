<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
     body {
  font-family: 'Poppins', sans-serif;
  background: #fff;
  padding: 20px;
}

.tab-container {
  max-width: 100%;
}

.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tab {
  padding: 12px 24px;
  border-radius: 50px;
  background: #F5F5F5;
  color: #333;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  transition: all 0.3s ease;
}

.tab:hover {
  background: #e0e0e0;
}

.tab.active {
  background: #00999A;
  color: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.tab-dropdown {
  display: none;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
  font-family: 'Poppins', sans-serif;
}

/* Mobile Styles */
@media (max-width: 600px) {
  .tabs {
    display: none;
  }
  .tab-dropdown {
    display: block;
    width: 100%;
  }
}
  </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                       <div class="tab-container">
  <nav class="tabs">
    <a href="#" class="tab active">Overview</a>
    <a href="#" class="tab">Details</a>
    <a href="#" class="tab">Reviews</a>
  </nav>

  <!-- Mobile Dropdown -->
  <select class="tab-dropdown">
    <option selected>Overview</option>
    <option>Details</option>
    <option>Reviews</option>
  </select>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
  const tabs = document.querySelectorAll('.tab');
const dropdown = document.querySelector('.tab-dropdown');

// Handle tab click
tabs.forEach(tab => {
  tab.addEventListener('click', (e) => {
    e.preventDefault();
    
    // Remove active from all tabs
    tabs.forEach(t => t.classList.remove('active'));
    
    // Add active to clicked tab
    tab.classList.add('active');

    // Update dropdown to match
    dropdown.value = tab.textContent.trim();
  });
});

// Handle dropdown change
dropdown.addEventListener('change', () => {
  // Remove active from all tabs
  tabs.forEach(t => t.classList.remove('active'));
  
  // Add active to matching tab
  const selectedText = dropdown.value;
  tabs.forEach(tab => {
    if (tab.textContent.trim() === selectedText) {
      tab.classList.add('active');
    }
  });
});
</script>
</body>

</html>
