<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; }
  .sidebar { min-height: 100vh; border-right: 1px solid #ddd; }
  .list-group-item.active { background-color: #00999A; color: white; }
  .list-group-item.active i { color: white; }
  .card-soft { background-color: #f9f9f9; border-radius: 10px; }
  .skeleton-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(90deg,#eee 25%,#ddd 50%,#eee 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar placeholder -->
    <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

    <!-- Main content -->
    <main class="col-lg-9 col-xl-10">
      <div class="topbar d-flex align-items-center p-2 border-bottom">
        <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="ri-menu-line"></i></button>
        <h5 class="ms-3 mb-0">Dashboard</h5>
      </div>

      <section class="p-3">
        <div class="card-soft p-3">
          <div class="skeleton-avatar"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch('sidebar-content.html')
.then(res => res.text())
.then(html => {
  document.getElementById('sidebar-container').innerHTML = html;

  // Highlight active menu
  const current = window.location.pathname.split('/').pop();
  document.querySelectorAll('#sidebar-container a').forEach(link => {
    if(link.getAttribute('href') === current){
      link.classList.add('active');
      let parent = link.closest('.collapse');
      while(parent){
        new bootstrap.Collapse(parent, {toggle:true});
        parent = parent.closest('.collapse');
      }
    }
  });

  // Sidebar toggle for mobile
  const sidebar = document.querySelector('.sidebar');
  document.getElementById('sidebarToggle').addEventListener('click',()=> sidebar.classList.toggle('open'));
  const sidebarClose = document.getElementById('sidebarClose');
  if(sidebarClose) sidebarClose.addEventListener('click',()=> sidebar.classList.remove('open'));
});
</script>
</body>
</html>
