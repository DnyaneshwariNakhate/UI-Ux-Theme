<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .progress-container::before {
            content: '';
            background-color: #ddd !important;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px;
            width: 100%;
            /* z-index: -1; */
        }

        .progress {
            background-color: #00999A !important;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px !important;
            width: 0%;
            transition: width 0.3s ease;
            /* z-index: -1; */
        }

        .circle {
            background-color: #fff;
            color: #999;
            border-radius: 50%;
            height: 40px;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ddd;
            position: relative;
            transition: all 0.3s ease;
        }

        .circle.active {
            border-color: #00999A;
            color: #00999A;
        }

        .circle::after {
            content: attr(data-label);
            position: absolute;
            top: 50px;
            font-size: 12px;
            color: #555;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 20px;
            background-color: #00999A;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .progress-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        @media (max-width: 600px) {
            .progress-container {
                flex-direction: column;
                align-items: flex-start;
                height: 300px;
            }

            .progress-container::before,
            .progress {
                width: 4px;
                height: 100%;
                left: 20px;
                top: 0;
                transform: none;
            }

            .circle {
                margin-left: 0;
            }

            .circle::after {
                position: relative;
                top: 10px;
                left: 50px;
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <div class="progress-wrapper">
                            <div class="progress-container">
                                <div class="progress" id="progress"></div>

                                <div class="circle active" data-label="Step 1">1</div>
                                <div class="circle" data-label="Step 2">2</div>
                                <div class="circle" data-label="Step 3">3</div>
                                <div class="circle" data-label="Step 4">4</div>
                            </div>

                            <div class="buttons">
                                <button id="prev" disabled>Prev</button>
                                <button id="next">Next</button>
                            </div>
                        </div>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        const progress = document.getElementById('progress');
        const prev = document.getElementById('prev');
        const next = document.getElementById('next');
        const circles = document.querySelectorAll('.circle');

        let currentActive = 1;

        next.addEventListener('click', () => {
            currentActive++;
            if (currentActive > circles.length) {
                currentActive = circles.length;
            }
            update();
        });

        prev.addEventListener('click', () => {
            currentActive--;
            if (currentActive < 1) {
                currentActive = 1;
            }
            update();
        });

        function update() {
            circles.forEach((circle, idx) => {
                if (idx < currentActive) {
                    circle.classList.add('active');
                } else {
                    circle.classList.remove('active');
                }
            });

            const actives = document.querySelectorAll('.active');
            progress.style.width = ((actives.length - 1) / (circles.length - 1)) * 100 + '%';

            prev.disabled = currentActive === 1;
            next.disabled = currentActive === circles.length;
        }

    </script>
</body>

</html>
