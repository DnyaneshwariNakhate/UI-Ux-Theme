<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Tabs container */
        .tabs {
            display: flex;
            justify-content: flex-start;
            border-bottom: 1px solid #ddd;
            background: #fff;
            padding: 0 16px;
        }

        .tab {
            padding: 14px 20px;
            cursor: pointer;
            color: #555;
            text-decoration: none;
            border: none;
            background: none;
            font-size: 16px;
        }

        .tab.active {
            font-weight: bold;
            color: #00999A;
            border-bottom: 3px solid #00999A;
            /* brand color */
        }

        /* Mobile dropdown */
        .mobile-tabs {
            display: none;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin: 10px;
        }

        @media (max-width: 600px) {
            .tabs {
                display: none;
                /* hide horizontal tabs */
            }

            .mobile-tabs {
                display: block;
                /* show dropdown */
            }
        }
    </style>
</head>

<body class="dashboard-page">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar placeholder -->
            <div id="sidebar-container" class="col-lg-3 col-xl-2 p-0"></div>

            <!-- Main content -->
            <main class="col-lg-9 col-xl-10">
                <div class="topbar d-flex align-items-center p-2 border-bottom">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle"><i
                            class="ri-menu-line"></i></button>
                    <h5 class="ms-3 mb-0">Dashboard</h5>
                </div>

                <section class="p-3">
                    <div class="card-soft p-3">
                        <!-- ------------------ -->
                        <!-- Desktop Tabs -->
                        <div class="tabs">
                            <button class="tab active" onclick="selectTab(this)">Overview</button>
                            <button class="tab" onclick="selectTab(this)">Details</button>
                            <button class="tab" onclick="selectTab(this)">Reviews</button>
                        </div>

                        <!-- Mobile Dropdown -->
                        <select class="mobile-tabs" onchange="selectMobileTab(this)">
                            <option>Overview</option>
                            <option>Details</option>
                            <option>Reviews</option>
                        </select>
                        <!-- ------------------ -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../sidebar-content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;

                // Highlight active menu
                const current = window.location.pathname.split('/').pop();
                document.querySelectorAll('#sidebar-container a').forEach(link => {
                    if (link.getAttribute('href') === current) {
                        link.classList.add('active');
                        let parent = link.closest('.collapse');
                        while (parent) {
                            new bootstrap.Collapse(parent, { toggle: true });
                            parent = parent.closest('.collapse');
                        }
                    }
                });

                // Sidebar toggle for mobile
                const sidebar = document.querySelector('.sidebar');
                document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
                const sidebarClose = document.getElementById('sidebarClose');
                if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
            });
    </script>
    <script>
        function selectTab(el) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
        }

        function selectMobileTab(el) {
            const value = el.value;
            document.querySelectorAll('.tab').forEach(tab => {
                if (tab.textContent === value) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        } 
    </script>
</body>

</html>
